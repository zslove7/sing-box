name: Build Android arm64 Naive Final

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name"
        required: true
        type: string
        default: "1.13.5"

jobs:
  build:
    name: Build Android Binary
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Android arm64
        run: |
          # 减少容易冲突的标签，仅保留核心
          TAGS="with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api,with_gvisor,with_tuic,with_shadowtls"
          
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          export ANDROID_CLANG=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          
          export CC=$ANDROID_CLANG/aarch64-linux-android26-clang
          export CXX=$ANDROID_CLANG/aarch64-linux-android26-clang++
          
          export CGO_ENABLED=1
          export GOOS=android
          export GOARCH=arm64
          
          # 移除 -Wl,-z,notext，改用更温和的参数
          # 尝试不强制静态链接 C++ 库，让它在运行时去找
          export CGO_LDFLAGS="-Wl,--allow-shlib-undefined -fuse-ld=lld"

          mkdir -p dist
          go build -v -trimpath -o dist/sing-box-android-arm64 -tags "$TAGS" \
          -ldflags "-s -w -X 'github.com/sagernet/sing-box/constant.Version=${{ github.event.inputs.version }}'" \
          ./cmd/sing-box

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-android-arm64
          path: dist/
