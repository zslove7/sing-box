name: Build Android arm64 Full

on:
  workflow_dispatch:
    inputs:
      version:
        description: "输入版本号 (例如 1.13.5)"
        required: true
        type: string
        default: "1.13.5"

jobs:
  build_android:
    name: Build Android Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Clone cronet-go
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Build Android arm64
        run: |
          set -xeuo pipefail
          
          # 必须包含这两个标签才能支持 Naive
          TAGS="with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api,with_gvisor,with_naive,with_naive_outbound,with_tuic,with_shadowtls"
          
          # 核心修正：提升至 API 30，解决 relocation 315 指针认证错误
          export ANDROID_CLANG=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC=$ANDROID_CLANG/aarch64-linux-android30-clang
          export CXX=$ANDROID_CLANG/aarch64-linux-android30-clang++
          
          export CGO_ENABLED=1
          export GOOS=android
          export GOARCH=arm64
          export LD=$ANDROID_CLANG/ld.lld

          mkdir -p dist
          
          # 增加编译参数：强制链接标准库并优化链接器行为
          go build -v -trimpath -o dist/sing-box-android-arm64 \
          -tags "$TAGS" \
          -ldflags "-s -w -X 'github.com/sagernet/sing-box/constant.Version=${{ github.event.inputs.version }}' -extldflags=-fuse-ld=lld -extldflags=-static-libstdc++ -extldflags=-Wl,--allow-shlib-undefined" \
          ./cmd/sing-box

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-android-arm64
          path: dist/
