name: Build Naive Only

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name"
        required: true
        type: string
        default: "1.13.5-custom"

jobs:
  calculate_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ github.event.inputs.version }}
    steps:
      - run: echo "Selected version ${{ github.event.inputs.version }}"

  build_custom:
    runs-on: ubuntu-latest
    needs: calculate_version
    strategy:
      matrix:
        include:
          # 1. Android arm64 纯内核 (开启 Naive)
          - { os: android, arch: arm64, ndk: "aarch64-linux-android23", naive: true }
          # 2. Windows amd64 纯内核 (开启 Naive)
          - { os: windows, arch: amd64, naive: true }
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'

      - name: Setup Android NDK
        if: matrix.os == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      # 关键步骤：下载 Naive 依赖的 Chromium 栈
      - name: Clone cronet-go
        if: matrix.naive
        run: |
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Build Binary
        run: |
          # 强制包含 naive 标签
          TAGS="with_quic,with_dhcp,with_wireguard,with_ech,with_utls,with_clash_api,with_gvisor,with_naive,with_tuic,with_shadowtls,with_grpc"
          export CGO_ENABLED=1
          
          if [ "${{ matrix.os }}" = "android" ]; then
            export CC='${{ matrix.ndk }}-clang'
            export CXX="${CC}++"
            export GOOS=android
            export GOARCH=arm64
          else
            export GOOS=${{ matrix.os }}
            export GOARCH=${{ matrix.arch }}
          fi

          mkdir -p dist
          go build -v -trimpath -o dist/sing-box-${{ matrix.os }}-${{ matrix.arch }} -tags "$TAGS" \
          -ldflags "-s -w -X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}'" \
          ./cmd/sing-box

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-naive-${{ matrix.os }}
          path: dist/
