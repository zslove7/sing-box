name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name"
        required: true
        type: string
        default: "1.13.5"
      build:
        description: "Build type"
        required: true
        type: choice
        default: "Android"
        options:
          - All
          - Binary
          - Android

jobs:
  calculate_version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.outputs.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'
      - name: Check input version
        if: github.event_name == 'workflow_dispatch'
        run: |-
          echo "version=${{ inputs.version }}" >> "$GITHUB_ENV"
      - name: Set outputs
        id: outputs
        run: |-
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build Android Binary
    runs-on: ubuntu-latest
    needs:
      - calculate_version
    strategy:
      matrix:
        include:
          - { os: android, arch: arm64, ndk: "aarch64-linux-android23", naive: true }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Clone cronet-go
        if: matrix.naive
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Set build tags
        run: |
          set -xeuo pipefail
          # 核心修正：加入 with_naive_outbound 并移除已废弃的 with_ech
          TAGS="with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api,with_gvisor,with_naive,with_naive_outbound,with_tuic,with_shadowtls"
          echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"

      - name: Build Android
        run: |
          set -xeuo pipefail
          # 指定 NDK 编译器路径
          export ANDROID_CLANG=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC=$ANDROID_CLANG/${{ matrix.ndk }}-clang
          export CXX="${CC}++"
          
          mkdir -p dist
          CGO_ENABLED=1 GOOS=android GOARCH=${{ matrix.arch }} \
          go build -v -trimpath -o dist/sing-box-android-arm64 -tags "${BUILD_TAGS}" \
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' -s -w -buildid=" \
          ./cmd/sing-box

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-android-arm64
          path: dist/
