name: Build Android arm64 Naive Final

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name"
        required: true
        type: string
        default: "1.13.5"

jobs:
  build:
    name: Build Android Binary
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b # r26b 是目前处理 cronet 静态链接最稳定的版本

      - name: Clone cronet-go
        run: |
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Build Android arm64
        run: |
          # 包含所有你要求的标签
          TAGS="with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api,with_gvisor,with_naive,with_naive_outbound,with_tuic,with_shadowtls"
          
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          export ANDROID_CLANG=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          
          # 使用 API 26 编译器
          export CC=$ANDROID_CLANG/aarch64-linux-android26-clang
          export CXX=$ANDROID_CLANG/aarch64-linux-android26-clang++
          
          export CGO_ENABLED=1
          export GOOS=android
          export GOARCH=arm64
          
          # 关键修正：通过 CGO_LDFLAGS 强制链接 C++ 标准库并允许未定义符号
          # 这能绕过 relocation 315 错误
          export CGO_LDFLAGS="-Wl,--allow-shlib-undefined -fuse-ld=lld -lstdc++"

          mkdir -p dist
          go build -v -trimpath -o dist/sing-box-android-arm64 -tags "$TAGS" \
          -ldflags "-s -w -X 'github.com/sagernet/sing-box/constant.Version=${{ github.event.inputs.version }}' -extldflags '-static-libstdc++'" \
          ./cmd/sing-box

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-android-arm64
          path: dist/
